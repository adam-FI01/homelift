# Local development profile. Activate with SPRING_PROFILES_ACTIVE=dev
# (the IntelliJ run configs and scripts/dev.sh already do this).

# Keep the dev database outside the repo and away from the default ./data, so it
# never depends on the working directory and survives `git clean`.
homelift.data-dir=${HOMELIFT_DATA_DIR:${user.home}/.homelift/dev}

# Show what Hibernate and Flyway are doing.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.flywaydb=INFO
logging.level.app.homelift=DEBUG

# More actuator endpoints are handy locally (never exposed in the container).
management.endpoints.web.exposure.include=health,info,env,flyway,mappings,beans
management.endpoint.health.show-details=always
