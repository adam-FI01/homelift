spring.application.name=homelift

# --- Storage -------------------------------------------------------------
# SQLite file lives on a mounted volume in Docker (/data). Locally it goes to ./data.
homelift.data-dir=${HOMELIFT_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${homelift.data-dir}/homelift.db?journal_mode=WAL&foreign_keys=true&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time; a single connection avoids SQLITE_BUSY and keeps memory low.
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema. Hibernate's validator expects BIGINT/TIMESTAMP column types that
# SQLite does not have, so it stays off; the integration tests cover the entity mappings.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# --- Web -----------------------------------------------------------------
server.port=${PORT:8080}
server.compression.enabled=true
server.shutdown=graceful
spring.threads.virtual.enabled=true
# Errors use RFC 9457 problem+json bodies.
spring.mvc.problemdetails.enabled=true

# --- Ops -----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true
