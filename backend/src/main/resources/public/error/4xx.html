<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · HomeLift</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --ink: #111; --sub: #6b6b6b; --btn: #111; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --ink: #f2f2f2; --sub: #9a9a9e; --btn: #f2f2f2; --on: #111; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px; }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
  p { margin: 0 0 24px; color: var(--sub); }
  a { display: inline-block; padding: 14px 24px; border-radius: 12px; background: var(--btn); color: var(--on);
    text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That address doesn't exist in HomeLift.</p>
  <a href="/">Back to HomeLift</a>
</main>
</body>
</html>
