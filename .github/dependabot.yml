version: 2
# Updates land in qa first, then reach main with the next qa → main promotion.
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: qa
    schedule: { interval: weekly }
    ignore:
      # IntelliJ 2026.2 can't sync a project on the Maven 3.10 wrapper; stay on 3.9.x until it can.
      - dependency-name: org.apache.maven:apache-maven
        versions: ['>= 3.10']
  - package-ecosystem: npm
    directory: /frontend
    target-branch: qa
    schedule: { interval: weekly }
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
    ignore:
      # Angular pins a TypeScript range; take TypeScript majors together with an Angular major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /e2e
    target-branch: qa
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: qa
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    target-branch: qa
    schedule: { interval: weekly }
