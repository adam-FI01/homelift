name: CI

# Runs on pull requests only. Every change reaches qa and main through a PR whose
# branch must be up to date, so re-running the same tests after the merge would
# only spend Actions minutes. Use "Run workflow" to run it by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The frontend job covers the Angular build; skip it here to keep this job fast.
      - run: ./mvnw -B verify -Dskip.frontend=true
