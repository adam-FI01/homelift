name: Native image

# Optional. Builds the GraalVM native image (instant start, a fraction of the memory) and publishes
# it as ghcr.io/<owner>/homelift:<version>-native for amd64 and arm64. It never touches :latest or
# the normal version tags, and it only runs when you start it by hand:
#   Actions → Native image → Run workflow, and enter a version such as 1.1.0.
# A native build takes about ten minutes per architecture, which is why it isn't automatic.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the image tag, without the v (1.1.0 gives :1.1.0-native)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each architecture builds natively on its own runner, because native-image can't cross-compile.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.native
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-arch tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1 ;;
          esac
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION-native" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show the result
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION-native"
